<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stuttgart Roleplay</title>
<style>
:root{--bg:#fff;--bg2:#f5f5f7;--tx:#1d1d1f;--mut:#86868b;--ac:#0071e3;--line:#e8e8ed;--card:#fff;--red:#d70015;--sh:0 4px 24px rgba(0,0,0,.06);--ease:cubic-bezier(.25,1,.5,1);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--bg2:#1c1c1e;--tx:#fff;--line:#2c2c2e;--card:#1c1c1e;--red:#ff453a;--sh:none;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.1;letter-spacing:-.02em;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1{font-size:clamp(34px,6vw,56px);font-weight:700}h2{font-size:clamp(24px,4vw,34px);font-weight:600}h3{font-size:20px;font-weight:600;margin-bottom:8px}
p{margin:0}.mut{color:var(--mut)}.sp{margin-top:24px}.lead{font-size:clamp(19px,2.6vw,24px);color:var(--mut);margin-top:14px}
.fade{animation:f .6s var(--ease)}@keyframes f{from{opacity:0;transform:translateY(8px)}}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:12px 22px;font:inherit;cursor:pointer;transition:all .3s var(--ease)}
.btn:hover{transform:scale(1.02);filter:brightness(1.08)}.btn.sec{background:var(--bg2);color:var(--tx)}.btn.red{background:var(--red)}.btn.sm{padding:6px 12px;font-size:14px}.block{display:block;width:100%;margin-bottom:10px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;transition:all .3s var(--ease);width:100%;margin-bottom:10px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(0,113,227,.2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:var(--sh);transition:all .3s var(--ease)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:500}
.tag{padding:3px 10px;border-radius:6px;font-size:12px;background:var(--bg2);color:var(--mut)}.tag.developer{background:#5e5ce6;color:#fff}.tag.owner{background:#ff9f0a;color:#000}.tag.admin{background:#30a46c;color:#fff}
.err{color:var(--red);min-height:22px;font-size:14px}
.pn{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line)}
.tiny{font-size:12px;color:var(--mut);text-decoration:none;transition:all .3s var(--ease)}.tiny:hover{color:var(--ac)}
.hero{text-align:center;max-width:860px;margin:0 auto;padding:clamp(70px,14vw,160px) 22px clamp(50px,9vw,110px)}.eyebrow{color:var(--ac);font-weight:600;margin-bottom:10px}
.hero h1{font-size:clamp(44px,9vw,88px)}.hero .btn{margin-top:30px}
.sec{max-width:980px;margin:0 auto;padding:70px 22px}.sec>h2{text-align:center;margin-bottom:36px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.grid3 .card:hover{transform:scale(1.02)}
.rules div{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}.rules div:last-child{border:0}.rules b{color:var(--ac);min-width:20px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:40px 22px;background:var(--bg2)}
.center{min-height:80vh;display:grid;place-items:center;padding:22px}.narrow{width:100%;max-width:400px}.narrow .tiny{display:block;text-align:center;margin-top:14px}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;display:flex;flex-direction:column;gap:6px;padding:24px 16px;border-right:1px solid var(--line);background:var(--bg2);min-height:100vh}
.side nav{display:flex;flex-direction:column;gap:4px}.brand{font-weight:700;font-size:20px;padding:0 12px 16px}.who{margin-top:auto;padding:16px 12px 8px}
.side nav a{padding:10px 12px;border-radius:8px;color:var(--tx);text-decoration:none;transition:all .3s var(--ease)}.side nav a:hover{background:var(--line)}.side nav a.on{background:var(--ac);color:#fff}
.content{padding:clamp(22px,5vw,56px);max-width:960px;width:100%}.stat span{font-size:44px;font-weight:700;display:block;line-height:1.1}
.ann{padding:18px 0;border-bottom:1px solid var(--line)}.ann:last-child{border:0}.ann p{white-space:pre-wrap;margin:6px 0}
@media(max-width:760px){.shell{grid-template-columns:1fr}.side{position:static;flex-direction:row;overflow-x:auto;min-height:0;padding:12px;border-right:0;border-bottom:1px solid var(--line);align-items:center}.side nav{flex-direction:row}.side nav a,.side .btn{white-space:nowrap}.brand,.who{display:none}}
@keyframes up{from{opacity:0;transform:translateY(22px)}}@keyframes sl{from{opacity:0;transform:translateX(-14px)}}@keyframes zi{from{opacity:0;transform:scale(.94)}}@keyframes fi{from{opacity:0}}@keyframes gr{to{background-position:300% center}}@keyframes fl{50%{transform:translate3d(36px,-44px,0) scale(1.12)}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:6;background:var(--bg)}
.pn{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);animation:fi .8s var(--ease)}
.hero{position:relative;isolation:isolate;overflow:hidden}.hero>*{animation:up 1s var(--ease) both}.hero>:nth-child(2){animation-delay:.12s}.hero>:nth-child(3){animation-delay:.26s}.hero>:nth-child(4){animation-delay:.4s}
.hero h1{background:linear-gradient(90deg,var(--tx),var(--ac),#bf5af2,var(--tx));background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:up 1s var(--ease) both,gr 9s linear infinite}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(80px);opacity:.3;animation:fl 14s ease-in-out infinite}.hero::before{width:340px;height:340px;background:#0071e3;left:6%;top:8%}.hero::after{width:300px;height:300px;background:#bf5af2;right:6%;bottom:4%;animation-delay:-7s}
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:calc(var(--i,0)*90ms)}.rv.in{opacity:1;transform:none}.rv.done{transition:all .3s var(--ease);transition-delay:0s}
.grid3 .card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 18px 44px rgba(0,0,0,.14)}.stat:hover{transform:translateY(-3px)}
.btn:active{transform:scale(.97)}.btn:not(.sec){position:relative;overflow:hidden}.btn:not(.sec)::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s var(--ease)}.btn:not(.sec):hover::after{transform:translateX(120%)}
.side nav a{animation:sl .6s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}.side nav a:hover{transform:translateX(4px)}
.content>*{animation:up .8s var(--ease) both;animation-delay:calc(var(--i,0)*80ms)}.ann{animation:up .7s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
tr{animation:fi .6s var(--ease) both;animation-delay:calc(var(--i,0)*50ms)}td{transition:background .3s var(--ease)}tr:hover td{background:var(--bg2)}.tag{transition:all .3s var(--ease)}.narrow{animation:zi .7s var(--ease) both}
.duty{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--mut);margin-right:8px}.duty.on .dot{background:#30d158;animation:pulse 2s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(48,209,88,.5)}100%{box-shadow:0 0 0 10px rgba(48,209,88,0)}}.av{width:44px;height:44px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:600;margin-bottom:12px}label{display:block;margin-bottom:4px}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;width:100%;height:3px;background:var(--ac);transform-origin:left;transform:scaleX(var(--p,0));z-index:7}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style></head><body><div id="app"></div>
<script>
const P='Stuttgart Roleplay'; // ← Projektname
const R={user:1,admin:2,owner:3,developer:4},L={user:'Nutzer',admin:'Admin',owner:'Eigentümer',developer:'Developer'};
const DESC={user:'Du kannst Ankündigungen lesen und dein Konto verwalten.',admin:'Du kannst Ankündigungen veröffentlichen, Nutzer anlegen und verwalten.',owner:'Du verwaltest Admins und Nutzer und siehst das Aktivitätsprotokoll.',developer:'Du hast vollen Zugriff auf alle Bereiche und alle Mitglieder.'};
const RULES=['Respekt: Behandle alle Spieler und das Team respektvoll. Beleidigungen, Rassismus und Diskriminierung führen zum sofortigen Ausschluss.', 'Realistisches Rollenspiel: Verhalte dich so, wie es dein Charakter im echten Leben tun würde. Unrealistische Handlungen (Fail-RP) sind verboten.', 'Kein Powergaming: Erzwinge keine Handlungen bei anderen Spielern und lass jedem die Chance, auf dein Rollenspiel zu reagieren.', 'Kein Metagaming: Informationen aus Discord, Streams oder Videos dürfen im Rollenspiel nicht verwendet werden.', 'Kein RDM und kein VDM: Andere ohne glaubwürdigen Rollenspiel-Grund zu töten, zu verletzen oder zu überfahren ist verboten.', 'Angst um das eigene Leben: Bei Bedrohung mit einer Waffe verhältst du dich wie im echten Leben und leistest keinen unrealistischen Widerstand.', 'Anweisungen des Teams: Folge den Anweisungen von Teammitgliedern. Beschwerden klärst du später im Ticket, nicht im laufenden Spiel.', 'Fair Play: Cheats, Hacks und das Ausnutzen von Bugs sind verboten. Fehler meldest du dem Team.'];
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=t=>t?new Date(t).toLocaleString('de-AT',{dateStyle:'medium',timeStyle:'short'}):'–';
const $=id=>document.getElementById(id),v=id=>$(id).value,A=$('app'),PAGES=['start','news','duty','team','members','log','account'];
let me=null,demo=false,D,U=[];
async function api(m,u,b){if(demo)return fake(m,u,b);const r=await fetch('/api/'+u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Fehler');return d}
async function fake(m,u,b){const r=u.split('/'),a=me,F=D.users,lw=t=>R[t.role]<R[a.role],bad=s=>{throw new Error(s)},lg=x=>D.log.unshift({t:Date.now(),by:a.username,text:x});
 if(r[0]==='login'){const x=F.find(z=>z.role===b.role);x.lastLogin=Date.now();return x}
 if(r[0]==='logout')return{};
 if(r[0]==='me'){if(b.username&&F.some(z=>z.username===b.username&&z.id!==a.id))bad('Benutzername vergeben');if(b.username)F.find(z=>z.id===a.id).username=a.username=b.username;return a}
 const vis=id=>{const t=F.find(z=>z.id===id);return t&&(t.id===a.id||lw(t))},td=()=>new Date().toLocaleDateString('sv');
 if(r[0]==='status')return{since:D.duty[a.id]||null};
 if(r[0]==='duty'){const x=D.duty[a.id];if(b.on){D.duty[a.id]=Date.now();lg('hat sich im Dienst angemeldet')}else{D.shifts.unshift({id:D.seq++,uid:a.id,name:a.username,start:x,end:Date.now()});delete D.duty[a.id];lg('hat sich vom Dienst abgemeldet')}return{}}
 if(r[0]==='team')return F.map(t=>({id:t.id,username:t.username,role:t.role,since:D.duty[t.id]||null,absent:D.abs.find(z=>z.uid===t.id&&z.status!=='abgelehnt'&&z.from<=td()&&z.to>=td())||null}));
 if(r[0]==='shifts')return D.shifts.filter(s=>vis(s.uid));
 if(r[0]==='abs'){if(m==='GET')return D.abs.filter(z=>vis(z.uid)).map(z=>({...z,canDecide:z.uid!==a.id&&z.status==='offen'&&R[a.role]>1,canRemove:z.uid===a.id||R[a.role]>1}));
  if(m==='POST'){if(!b.from||!b.to||b.to<b.from)bad('Ungültiger Zeitraum');if(!b.reason.trim())bad('Bitte einen Grund angeben');D.abs.unshift({id:D.seq++,uid:a.id,name:a.username,from:b.from,to:b.to,reason:b.reason,status:'offen',created:Date.now()});lg('hat eine Abmeldung vom '+b.from+' bis '+b.to+' geplant');return{}}
  const z=D.abs.find(x=>x.id===+r[1]);if(m==='DELETE')D.abs=D.abs.filter(x=>x!==z);else{z.status=b.status;lg('hat die Abmeldung von „'+z.name+'“ '+b.status)}return{}}
 if(r[0]==='log')return D.log;
 if(r[0]==='ann'){if(m==='GET')return D.ann;if(m==='POST'){if(!b.title||!b.text)bad('Titel und Text nötig');D.ann.unshift({id:D.seq++,title:b.title,text:b.text,author:a.username,date:Date.now()});lg('hat die Ankündigung „'+b.title+'“ veröffentlicht')}else D.ann=D.ann.filter(x=>x.id!==+r[1]);return{}}
 if(m==='GET')return F.filter(t=>t.id===a.id||lw(t)).map(t=>({...t,canDelete:lw(t)&&R[a.role]>1,canRole:lw(t)&&R[a.role]>2}));
 if(m==='POST'){if(b.username.trim().length<3||b.password.length<3)bad('Mindestens 3 Zeichen');if(F.some(z=>z.username===b.username))bad('Benutzername vergeben');F.push({id:D.seq++,username:b.username.trim(),role:b.role,created:Date.now(),lastLogin:null});lg('hat „'+b.username+'“ als '+b.role+' angelegt');return{}}
 const t=F.find(z=>z.id===+r[1]);
 if(m==='DELETE'){D.users=F.filter(z=>z!==t);lg('hat „'+t.username+'“ ('+t.role+') gelöscht')}else if(r[2]==='role'){lg('hat „'+t.username+'“ von '+t.role+' zu '+b.role+' geändert');t.role=b.role}else lg('hat das Passwort von „'+t.username+'“ zurückgesetzt');return{}}
async function boot(){try{const r=await fetch('/api/ping');demo=!(r.ok&&(await r.json()).ok)}catch{demo=true}
 if(demo){const n=Date.now(),d=864e5;D={seq:20,users:[{id:1,username:'Chef',role:'developer',created:n-40*d,lastLogin:n-36e5},{id:2,username:'Maria',role:'owner',created:n-30*d,lastLogin:n-d},{id:3,username:'Anna',role:'admin',created:n-20*d,lastLogin:n-2*d},{id:4,username:'Ben',role:'user',created:n-10*d,lastLogin:n-3*d},{id:5,username:'Clara',role:'user',created:n-5*d,lastLogin:null}],
  duty:{2:n-72e5},shifts:[{id:30,uid:3,name:'Anna',start:n-d-9e6,end:n-d-3e6}],abs:[{id:31,uid:4,name:'Ben',from:new Date(n+2*d).toLocaleDateString('sv'),to:new Date(n+5*d).toLocaleDateString('sv'),reason:'Urlaub',status:'offen',created:n}],ann:[{id:1,title:'Willkommen im Portal',text:'Das ist eine Beispiel-Ankündigung.\nHier erscheinen später echte Neuigkeiten.',author:'Chef',date:n-2*d}],log:[{t:n-d,by:'Maria',text:'hat „Clara“ als user angelegt'},{t:n-2*d,by:'Chef',text:'hat „Anna“ von user zu admin geändert'}]}}
 else{try{me=await api('GET','me')}catch{}}
 addEventListener('hashchange',route);addEventListener('scroll',()=>{const h=document.documentElement,m=h.scrollHeight-innerHeight;h.style.setProperty('--p',m>0?scrollY/m:0)},{passive:true});route()}
function fx(){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){const t=x.target;t.classList.add('in');setTimeout(()=>t.classList.add('done'),1400);io.unobserve(t)}}),{threshold:.12});
 document.querySelectorAll('.rv').forEach((el,i)=>{el.style.setProperty('--i',i%4);io.observe(el)});
 ['.content>*','.side nav a','tr','.ann'].forEach(s=>document.querySelectorAll(s).forEach((el,i)=>el.style.setProperty('--i',Math.min(i,12))));
 document.querySelectorAll('.stat span:first-child').forEach(s=>{const n=+s.textContent;let t0;const f=t=>{t0=t0||t;const p=Math.min((t-t0)/900,1);s.textContent=Math.round(n*(1-Math.pow(1-p,3)));p<1&&requestAnimationFrame(f)};requestAnimationFrame(f)})}
function route(){const p=location.hash.slice(1);if(!me)return p==='login'?loginView():pubView();appView(PAGES.includes(p)&&!(p==='members'&&R[me.role]<2)&&!(p==='log'&&R[me.role]<3)?p:'start')}
function pubView(){A.innerHTML=`<header class="pn"><b>${e(P)}</b><a class="tiny" href="#login">Als Staffmitglied anmelden</a></header><main class="fade">
<section class="hero"><p class="eyebrow">Willkommen</p><h1>${e(P)}.</h1><p class="lead">Realistisches Rollenspiel in Stuttgart – fair, respektvoll und gemeinsam.</p><button class="btn" onclick="$('features').scrollIntoView()">Mehr erfahren &gt;</button></section>
<section class="sec" id="features"><h2 class="rv">Warum ${e(P)}?</h2><div class="grid3">${[['Einfach','Schnell starten, klare Abläufe und ein Team, das dir beim Einstieg hilft.'],['Sicher','Faire Regeln, ein aktives Team und ein respektvoller Umgang für ein schönes Spielerlebnis.'],['Gemeinsam','Erlebe Geschichten mit anderen Spielern – als Gemeinschaft, die zusammen wächst.']].map(x=>`<div class="card rv"><h3>${x[0]}</h3><p class="mut">${x[1]}</p></div>`).join('')}</div></section>
<section class="sec"><h2 class="rv">Regeln</h2><div class="card rules">${RULES.map((x,i)=>`<div class="rv"><b>${i+1}</b><span><b style="color:var(--tx);min-width:0">${e(x.split(': ')[0])}</b><br><span class="mut">${e(x.split(': ').slice(1).join(': '))}</span></span></div>`).join('')}</div></section></main><footer>© ${new Date().getFullYear()} ${e(P)}</footer><i id="bar"></i>`;fx()}
function loginView(){A.innerHTML=`<div class="center fade"><div class="card narrow"><h2>Staff-Anmeldung</h2><p class="mut" style="margin:6px 0 20px">Nur für Teammitglieder.</p>
${demo?`<p class="mut" style="margin-bottom:12px">Demo-Modus – wähle eine Rolle:</p>${['developer','owner','admin','user'].map(r=>`<button class="btn sec block" onclick="demoLogin('${r}')">${L[r]}</button>`).join('')}`:`<input id="lu" placeholder="Benutzername" autocomplete="username"><input id="lp" type="password" placeholder="Passwort" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><div class="err" id="le"></div><button class="btn block" onclick="doLogin()">Anmelden</button>`}
<a class="tiny" href="#">‹ Zurück zur Website</a></div></div>`}
async function doLogin(){try{me=await api('POST','login',{username:v('lu'),password:v('lp')});location.hash='start';route()}catch(x){$('le').textContent=x.message}}
async function demoLogin(r){me=await api('POST','login',{role:r});location.hash='start';route()}
async function logout(){await api('POST','logout');me=null;location.hash='';route()}
const annList=(l,del)=>l.length?l.map(a=>`<div class="ann"><h3>${e(a.title)}</h3><p>${e(a.text)}</p><span class="mut" style="font-size:13px">${e(a.author)} · ${fd(a.date)}</span>${del?` <button class="btn red sm" style="float:right" onclick="delAnn(${a.id})">Löschen</button>`:''}</div>`).join(''):'<p class="mut">Keine Ankündigungen.</p>';
const RA=()=>['user','admin','owner','developer'].filter(r=>R[r]<=R[me.role]);
let tick,LG=[];
const clock=ms=>{const s=Math.max(0,Math.round(ms/1000));return [s/3600|0,s%3600/60|0,s%60].map(n=>String(n).padStart(2,'0')).join(':')};
const dur=ms=>{const m=Math.round(ms/60000);return Math.floor(m/60)+' Std '+m%60+' Min'};
const day=s=>new Date(s+'T00:00').toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'numeric'});
const stTag=s=>`<span class="tag ${s==='genehmigt'?'admin':''}" ${s==='abgelehnt'?'style="background:var(--red);color:#fff"':''}>${s}</span>`;
async function dutyCard(){const s=(await api('GET','status')).since;clearInterval(tick);if(s)tick=setInterval(()=>{const t=$('tm');t?t.textContent=clock(Date.now()-s):clearInterval(tick)},1000);
 return `<div class="card sp duty ${s?'on':''}"><div><span class="dot"></span><b>${s?'Im Dienst':'Abgemeldet'}</b><div class="mut" id="tm" style="font-size:15px">${s?clock(Date.now()-s):'Du bist aktuell nicht im Dienst.'}</div></div><button class="btn ${s?'red':''}" onclick="toggleDuty(${!s})">${s?'Vom Dienst abmelden':'Im Dienst anmelden'}</button></div>`}
const PG={
start:async()=>{const ann=await api('GET','ann'),st=R[me.role]>1,n=st?(await api('GET','users')).length:0;return `<h1>Hallo, ${e(me.username)}.</h1><p class="lead">${DESC[me.role]}</p>${await dutyCard()}${st?`<div class="card stat sp"><span>${n}</span><span class="mut" style="font-size:15px;font-weight:400">sichtbare Mitglieder</span></div>`:''}<h2 class="sp">Neueste Ankündigungen</h2><div class="card sp">${annList(ann.slice(0,3),false)}</div>`},
news:async()=>{const ann=await api('GET','ann'),st=R[me.role]>1;return `<h1>Ankündigungen</h1>${st?`<div class="card sp"><h3>Neue Ankündigung</h3><input id="at" placeholder="Titel"><textarea id="ax" rows="3" placeholder="Text"></textarea><div class="err" id="ae"></div><button class="btn" onclick="postAnn()">Veröffentlichen</button></div>`:''}<div class="card sp">${annList(ann,st)}</div>`},
members:async()=>{U=await api('GET','users');const cr=me.role==='admin'?['user']:RA();return `<h1>Mitglieder verwalten</h1><div class="card sp"><h3>Neues Mitglied</h3><div class="row"><input id="nu" placeholder="Benutzername"><input id="np" type="password" placeholder="Passwort"><select id="nr">${cr.map(r=>`<option value="${r}">${L[r]}</option>`).join('')}</select><button class="btn" style="margin-bottom:10px" onclick="addUser()">Anlegen</button></div><div class="err" id="ue"></div></div>
<input class="sp" id="fq" placeholder="Mitglieder suchen …" oninput="filt()"><div class="card sp scroll"><table><tr><th>Name</th><th>Art</th><th>Erstellt</th><th>Letzter Login</th><th></th></tr>${U.map(u=>`<tr><td>${e(u.username)}</td><td>${u.canRole?`<select style="margin:0;width:auto" onchange="setRole(${u.id},this.value)">${RA().map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${L[r]}</option>`).join('')}</select>`:`<span class="tag ${u.role}">${L[u.role]}</span>`}</td><td>${fd(u.created)}</td><td>${fd(u.lastLogin)}</td><td>${u.canDelete?`<button class="btn sec sm" onclick="resetPw(${u.id})">Passwort</button> <button class="btn red sm" onclick="delUser(${u.id})">Löschen</button>`:''}</td></tr>`).join('')}</table></div>
<p class="mut sp" style="font-size:13px">Passwörter sind verschlüsselt gespeichert und nicht einsehbar. Mit „Passwort“ setzt du für Mitglieder unter dir ein neues.</p>`},
log:async()=>{const l=LG=await api('GET','log');return `<h1>Aktivitätsprotokoll</h1><p class="lead">Alles, was im Portal passiert, wird dauerhaft festgehalten.</p><button class="btn sec sp" onclick="csv()">Als CSV exportieren</button><div class="card sp scroll"><table><tr><th>Zeit</th><th>Von</th><th>Aktion</th></tr>${l.map(x=>`<tr><td>${fd(x.t)}</td><td>${e(x.by)}</td><td style="white-space:normal">${e(x.text)}</td></tr>`).join('')}</table></div>`},
duty:async()=>{const card=await dutyCard(),ab=await api('GET','abs'),sh=await api('GET','shifts');
 return `<h1>Dienst &amp; Abmeldung</h1>${card}<div class="card sp"><h3>Abmeldung planen</h3><div class="row"><div><label class="mut" style="font-size:13px">Von</label><input id="af" type="date"></div><div><label class="mut" style="font-size:13px">Bis</label><input id="at2" type="date"></div></div><input id="ar" placeholder="Grund (z. B. Urlaub)" maxlength="200"><div class="err" id="ab"></div><button class="btn" onclick="addAbs()">Abmeldung eintragen</button></div>
<h2 class="sp">Abmeldungen</h2><div class="card sp scroll"><table><tr><th>Name</th><th>Zeitraum</th><th>Grund</th><th>Status</th><th></th></tr>${ab.length?ab.map(z=>`<tr><td>${e(z.name)}</td><td>${day(z.from)} – ${day(z.to)}</td><td style="white-space:normal">${e(z.reason)}</td><td>${stTag(z.status)}</td><td>${z.canDecide?`<button class="btn sm" onclick="decide(${z.id},'genehmigt')">Genehmigen</button> <button class="btn sec sm" onclick="decide(${z.id},'abgelehnt')">Ablehnen</button> `:''}${z.canRemove?`<button class="btn red sm" onclick="rmAbs(${z.id})">Entfernen</button>`:''}</td></tr>`).join(''):'<tr><td colspan="5" class="mut">Keine Abmeldungen.</td></tr>'}</table></div>
<h2 class="sp">Dienstzeiten</h2><div class="card sp scroll"><table><tr><th>Name</th><th>Angemeldet</th><th>Abgemeldet</th><th>Dauer</th></tr>${sh.length?sh.map(s=>`<tr><td>${e(s.name)}</td><td>${fd(s.start)}</td><td>${fd(s.end)}</td><td>${dur(s.end-s.start)}</td></tr>`).join(''):'<tr><td colspan="4" class="mut">Noch keine Dienstzeiten.</td></tr>'}</table></div>`},
team:async()=>{const t=await api('GET','team'),n=t.filter(x=>x.since).length;
 return `<h1>Team</h1><p class="lead">${n} von ${t.length} im Dienst.</p><div class="grid3 sp">${t.map(x=>`<div class="card"><div class="av">${e(x.username[0].toUpperCase())}</div><h3>${e(x.username)}</h3><span class="tag ${x.role}">${L[x.role]}</span><p class="mut" style="margin-top:10px"><span class="dot" style="background:${x.since?'#30d158':x.absent?'#ff9f0a':'var(--mut)'}"></span>${x.since?'Im Dienst':x.absent?'Abwesend bis '+day(x.absent.to):'Abgemeldet'}</p></div>`).join('')}</div>`},
account:async()=>`<h1>Mein Account</h1><p class="lead">Art: <span class="tag ${me.role}">${L[me.role]}</span> – sie kann nur von einer höheren Stufe geändert werden.</p><div class="card sp narrow" style="max-width:480px"><input id="mu" value="${e(me.username)}" placeholder="Neuer Benutzername"><input id="mp" type="password" placeholder="Neues Passwort (leer = behalten)"><input id="mo" type="password" placeholder="Aktuelles Passwort (zur Bestätigung)"><div class="err" id="me"></div><button class="btn" onclick="saveMe()">Speichern</button></div>`};
async function appView(p){clearInterval(tick);const st=R[me.role]>1,ow=R[me.role]>2,nav=[['start','Startseite'],['news','Ankündigungen'],['duty','Dienst &amp; Abmeldung'],['team','Team'],...(st?[['members','Mitglieder verwalten']]:[]),...(ow?[['log','Aktivitätsprotokoll']]:[]),['account','Mein Account']];
 A.innerHTML=`<div class="shell"><aside class="side"><div class="brand">${e(P)}</div><nav>${nav.map(n=>`<a href="#${n[0]}" class="${n[0]===p?'on':''}">${n[1]}</a>`).join('')}</nav><div class="who"><b>${e(me.username)}</b><br><span class="tag ${me.role}">${L[me.role]}</span></div><button class="btn sec" onclick="logout()">Abmelden</button></aside><main class="content fade" id="page"></main></div>`;
 try{$('page').innerHTML=await PG[p]();fx()}catch(x){$('page').innerHTML='<p class="err">'+e(x.message)+'</p>'}}
const go=async(f)=>{try{await f();route()}catch(x){alert(x.message)}};
const postAnn=()=>go(()=>api('POST','ann',{title:v('at'),text:v('ax')})),delAnn=id=>confirm('Ankündigung löschen?')&&go(()=>api('DELETE','ann/'+id));
const addUser=()=>go(()=>api('POST','users',{username:v('nu'),password:v('np'),role:v('nr')})),setRole=(id,role)=>go(()=>api('PATCH','users/'+id+'/role',{role}));
const delUser=id=>{const t=U.find(x=>x.id===id);confirm('„'+t.username+'“ wirklich löschen? Das wird im Protokoll festgehalten.')&&go(()=>api('DELETE','users/'+id))};
const resetPw=id=>{const t=U.find(x=>x.id===id),p=prompt('Neues Passwort für „'+t.username+'“ (mind. 3 Zeichen):');p&&go(()=>api('PATCH','users/'+id+'/password',{password:p}))};
const toggleDuty=on=>go(()=>api('POST','duty',{on})),addAbs=()=>go(()=>api('POST','abs',{from:v('af'),to:v('at2'),reason:v('ar')})),decide=(id,status)=>go(()=>api('PATCH','abs/'+id,{status})),rmAbs=id=>confirm('Abmeldung entfernen?')&&go(()=>api('DELETE','abs/'+id));
const filt=()=>{const q=v('fq').toLowerCase();document.querySelectorAll('.content tr:not(:first-child)').forEach(r=>r.style.display=r.cells[0].textContent.toLowerCase().includes(q)?'':'none')};
const csv=()=>{const q=s=>'"'+String(s).replace(/"/g,'""')+'"',t=['Zeit;Von;Aktion',...LG.map(x=>[fd(x.t),x.by,x.text].map(q).join(';'))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='protokoll.csv';a.click()};
const saveMe=()=>go(async()=>{me=await api('PATCH','me',{username:v('mu'),password:v('mp'),old:v('mo')})});
boot();
</script></body></html>
